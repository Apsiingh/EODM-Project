server:
  port: ${PORT_AUTH_SERVICE:8081}

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/enterprise_ocr}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:welcome}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:EnterpriseOcrJwtSecretKey32BytesLongMinimumSecretForSigningHmac256!!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}       # 24 hours
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days

seed:
  admin-password: ${SEED_ADMIN_PASSWORD:password123}
  user-password: ${SEED_USER_PASSWORD:password123}
